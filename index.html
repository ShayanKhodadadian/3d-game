<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>آرزوی پایان دوری</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: Tahoma, sans-serif; }
        canvas { display: block; }
        
        /* پیام چرخش صفحه برای موبایل */
        #orientation-overlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #222; color: white; z-index: 1000;
            justify-content: center; align-items: center; text-align: center; font-size: 24px;
        }
        @media screen and (max-width: 768px) and (orientation: portrait) {
            #orientation-overlay { display: flex; }
        }
        
        /* نگهدارنده جوی استیک */
        #joystick-zone {
            display: none; position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 10;
        }
        @media screen and (max-width: 768px) and (orientation: landscape) {
            #joystick-zone { display: block; }
        }
    </style>
    <!-- اضافه کردن Three.js و Nipple.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

    <div id="orientation-overlay">لطفا موبایل خود را به حالت افقی (Landscape) بچرخانید.</div>
    <div id="joystick-zone"></div>

    <script>
        // تنظیمات پایه صحنه
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a35); // رنگ خنثی برای فاز اول زندگی
        scene.fog = new THREE.Fog(0x2a2a35, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // نورپردازی پایه
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // کاراکتر پایه (آواتار شایان - فعلا یک کپسول ساده)
        const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const material = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const player = new THREE.Mesh(geometry, material);
        player.position.y = 1;
        scene.add(player);

        // کف اتاق
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        camera.position.set(0, 5, 8);
        camera.lookAt(player.position);

        // متغیرهای کنترل حرکت
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joyStickActive = false;
        let joystickVector = { x: 0, y: 0 };
        const speed = 0.1;

        // کنترل‌های WASD
        document.addEventListener('keydown', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        // پیکربندی جوی‌استیک برای موبایل
        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isTouchDevice) {
            const manager = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'white'
            });

            manager.on('move', (e, data) => {
                joyStickActive = true;
                joystickVector.x = Math.cos(data.angle.radian);
                joystickVector.y = Math.sin(data.angle.radian);
            });
            manager.on('end', () => {
                joyStickActive = false;
                joystickVector = { x: 0, y: 0 };
            });
        }

        // حلقه رندر و منطق حرکت
        function animate() {
            requestAnimationFrame(animate);

            // منطق حرکت WASD
            if (moveForward) player.position.z -= speed;
            if (moveBackward) player.position.z += speed;
            if (moveLeft) player.position.x -= speed;
            if (moveRight) player.position.x += speed;

            // منطق حرکت جوی‌استیک موبایل
            if (joyStickActive) {
                player.position.x += joystickVector.x * speed;
                player.position.z -= joystickVector.y * speed;
            }

            // دنبال کردن دوربین
            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 8;

            renderer.render(scene, camera);
        }

        // مدیریت تغییر اندازه صفحه
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>

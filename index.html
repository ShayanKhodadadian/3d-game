<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>آرزوی پایان دوری</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; font-family: Tahoma, sans-serif; }
        canvas { display: block; }
        
        /* پیام چرخش صفحه برای موبایل */
        #orientation-overlay {
            display: none;
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #222; color: white; z-index: 1000;
            justify-content: center; align-items: center; text-align: center; font-size: 24px;
        }
        @media screen and (max-width: 768px) and (orientation: portrait) {
            #orientation-overlay { display: flex; }
        }
        
        /* نگهدارنده جوی استیک */
        #joystick-zone {
            display: none; position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; z-index: 10;
        }
        @media screen and (max-width: 768px) and (orientation: landscape) {
            #joystick-zone { display: block; }
        }

        /* باکس نمایش داستان و افکار */
        #dialogue-box {
            display: none; position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%);
            width: 80%; max-width: 600px; background: rgba(0, 0, 0, 0.8);
            color: white; padding: 20px; border-radius: 10px; border: 2px solid #555;
            text-align: center; font-size: 18px; z-index: 20; line-height: 1.6;
        }

        /* دکمه راهنمای تعامل */
        #interact-prompt {
            display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.9); color: black; padding: 10px 20px;
            border-radius: 20px; font-weight: bold; z-index: 15; pointer-events: none;
        }
    </style>
    <!-- کتابخانه‌های موتور سه‌بعدی و جوی‌استیک -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
</head>
<body>

    <div id="orientation-overlay">لطفا موبایل خود را به حالت افقی (Landscape) بچرخانید.</div>
    <div id="joystick-zone"></div>
    <div id="dialogue-box">متن داستان اینجا قرار می‌گیرد...</div>
    <div id="interact-prompt">برای تعامل کلیک کنید (یا کلید E)</div>

    <script>
        // ۱. تنظیمات پایه صحنه و رندر
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2a2a35);
        scene.fog = new THREE.Fog(0x2a2a35, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // ۲. نورپردازی
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // ۳. کاراکتر شایان
        const geometry = new THREE.CapsuleGeometry(0.5, 1, 4, 8);
        const material = new THREE.MeshStandardMaterial({ color: 0x888888 });
        const player = new THREE.Mesh(geometry, material);
        player.position.y = 1;
        scene.add(player);

        // ۴. کف اتاق
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        camera.position.set(0, 5, 8);
        camera.lookAt(player.position);

        // ۵. متغیرهای کنترلی و وضعیت داستان
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let joyStickActive = false;
        let joystickVector = { x: 0, y: 0 };
        const speed = 0.1;

        const dialogueBox = document.getElementById('dialogue-box');
        const interactPrompt = document.getElementById('interact-prompt');

        let storyState = "ROUTINE";
        let activeInteractable = null;
        const interactables = [];

        let isTransitioningColor = false;
        const targetAmbientLightIntensity = 1.0;
        const targetDirLightIntensity = 1.2;
        const targetSceneColor = new THREE.Color(0x87CEEB);

        // ۶. تعریف تابع ساخت شیء پیش از هرگونه فراخوانی
        function createInteractableObject(color, x, z, width, depth, name, routineText) {
            const geo = new THREE.BoxGeometry(width, 1, depth);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            
            interactables.push({
                mesh: mesh,
                name: name,
                routineText: routineText
            });
        }

        // ۷. چیدمان اشیاء اتاق
        createInteractableObject(0x444488, -4, -3, 2, 4, "Bed", "تخت خواب. هر روز بیدار شدن... و دوباره همان چرخه تکراری.");
        createInteractableObject(0x553311, 4, -4, 3, 1.5, "Desk", "میز کار. باید برای کلاس زبان آلمانی آماده شوم. تدریس... تکرار...");
        createInteractableObject(0x111111, 4, 2, 2, 1, "Piano", "پیانو. می‌نوازم، اما ملودی‌ها رنگی ندارند.");
        createInteractableObject(0x884422, -4, 3, 1, 1, "Guitar", "گیتار. گاهی می‌زنم تا زمان بگذرد.");
        createInteractableObject(0xaaaaaa, 0, -5, 1, 1, "Laptop", "لپ‌تاپ. چت کردن با دوستان، هماهنگی باشگاه... چقدر خسته‌کننده.");
        createInteractableObject(0x332211, 0, 4, 1.5, 0.2, "Door", "درب خروج. فعلاً دلیلی برای بیرون رفتن ندارم.");

        // ۸. توابع مدیریت دیالوگ و تعامل
        function showDialogue(text) {
            dialogueBox.innerHTML = text;
            dialogueBox.style.display = 'block';
            setTimeout(() => {
                dialogueBox.style.display = 'none';
            }, 4000);
        }

        function handleInteraction() {
            if (storyState === "ROUTINE") {
                showDialogue(activeInteractable.routineText);
                
                if (activeInteractable.name === "Laptop") {
                    setTimeout(() => {
                        storyState = "MEET_MELISSA";
                        showDialogue("یک پیام جدید... از شخصی به نام ملیسا. ساکن جلفا. چیزی در این چت متفاوت است...");
                        
                        setTimeout(() => {
                            storyState = "IN_LOVE";
                            isTransitioningColor = true;
                            showDialogue("انگار دنیا تغییر کرده است. دیگر به خودم فکر نمی‌کنم. به آینده با ملیسا فکر می‌کنم...");
                        }, 4000);
                    }, 500);
                }
            } 
            else if (storyState === "IN_LOVE") {
                if (activeInteractable.name === "Guitar") {
                    showDialogue("گیتار... برای ملیسا آهنگ‌های زیبایی خواهم ساخت.");
                } else if (activeInteractable.name === "Piano") {
                    showDialogue("حالا ملودی‌ها در ذهنم رنگ و بوی عشق دارند.");
                } else if (activeInteractable.name === "Door") {
                    showDialogue("باید به دیدنش بروم. به جلفا...");
                    setTimeout(() => {
                        loadJolfaScene();
                    }, 3000);
                } else {
                    showDialogue("همه چیز حالا معنای جدیدی دارد. هدف من خوشبخت کردن اوست.");
                }
            }
            else if (storyState === "JOLFA") {
                if (activeInteractable.name === "Melissa") {
                    showDialogue("بالاخره کنارمی... (او را در آغوش می‌گیرد). برایت گل آوردم و می‌خواهم برایت گیتار بزنم.");
                    setTimeout(() => {
                        triggerWakeUp();
                    }, 5000);
                }
            }
        }

        function loadJolfaScene() {
            storyState = "JOLFA";
            interactables.forEach(obj => scene.remove(obj.mesh));
            interactables.length = 0;
            
            floor.material.color.setHex(0x2d4c1e);
            player.position.set(0, 1, 0);
            
            createInteractableObject(0x882222, -3, -2, 2, 4, "Car", "");
            createInteractableObject(0xff99aa, 3, -5, 0.6, 0.6, "Melissa", "");
            
            showDialogue("جلفا... رسیدم. آنجا ایستاده است!");
        }

        function triggerWakeUp() {
            storyState = "AWAKE";
            scene.background.setHex(0x111111);
            scene.fog.color.setHex(0x111111);
            ambientLight.intensity = 0.2;
            dirLight.intensity = 0.2;
            floor.material.color.setHex(0x111111);
            
            interactables.forEach(obj => scene.remove(obj.mesh));
            interactables.length = 0;
            
            dialogueBox.style.bottom = "40%";
            dialogueBox.style.fontSize = "24px";
            showDialogue("ناگهان از خواب بیدار شدم...<br>آرزو می‌کنم این دوری زودتر تمام شود و بیایم کنار کسی که با تمام وجودم عاشقشم.");
        }

        // ۹. شنود رویدادهای حرکتی و کلیدها
        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyE' && activeInteractable) handleInteraction();
            switch(e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
            }
        });
        document.addEventListener('keyup', (e) => {
            switch(e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });

        window.addEventListener('touchstart', () => {
            if (activeInteractable) handleInteraction();
        });

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
        if (isTouchDevice) {
            const manager = nipplejs.create({
                zone: document.getElementById('joystick-zone'),
                mode: 'static',
                position: { left: '50%', top: '50%' },
                color: 'white'
            });

            manager.on('move', (e, data) => {
                joyStickActive = true;
                joystickVector.x = Math.cos(data.angle.radian);
                joystickVector.y = Math.sin(data.angle.radian);
            });
            manager.on('end', () => {
                joyStickActive = false;
                joystickVector = { x: 0, y: 0 };
            });
        }

        // ۱۰. حلقه اصلی رندر و بازی
        function animate() {
            requestAnimationFrame(animate);

            if (moveForward) player.position.z -= speed;
            if (moveBackward) player.position.z += speed;
            if (moveLeft) player.position.x -= speed;
            if (moveRight) player.position.x += speed;

            if (joyStickActive) {
                player.position.x += joystickVector.x * speed;
                player.position.z -= joystickVector.y * speed;
            }

            let nearestObj = null;
            let minDistance = 2.5;

            for (let i = 0; i < interactables.length; i++) {
                let obj = interactables[i];
                let distance = player.position.distanceTo(obj.mesh.position);
                if (distance < minDistance) {
                    nearestObj = obj;
                    break;
                }
            }

            if (nearestObj) {
                activeInteractable = nearestObj;
                interactPrompt.style.display = 'block';
            } else {
                activeInteractable = null;
                interactPrompt.style.display = 'none';
            }

            camera.position.x = player.position.x;
            camera.position.z = player.position.z + 8;

            if (isTransitioningColor) {
                scene.background.lerp(targetSceneColor, 0.005);
                scene.fog.color.lerp(targetSceneColor, 0.005);
                
                if (ambientLight.intensity < targetAmbientLightIntensity) ambientLight.intensity += 0.002;
                if (dirLight.intensity < targetDirLightIntensity) dirLight.intensity += 0.002;
                
                if (ambientLight.intensity >= targetAmbientLightIntensity) {
                    isTransitioningColor = false; 
                }
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
